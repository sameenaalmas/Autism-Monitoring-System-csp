
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Autism Monitor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="edit-student-page">

    <nav class="navbar">
        <div class="logo">🧠 Autism Monitor</div>

        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('students') }}" class="active">Students</a>
            <a href="{{ url_for('add_observation') }}">Add Observation</a>
            <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
        </div>
    </nav>

    <main class="students-container">

        <div class="students-heading">
            <div>
                <h1>Edit Student</h1>
                <p>Update the student's details.</p>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="toast-container">
                    {% for category, message in messages %}
                        <div class="toast-message {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="students-card" style="padding: 28px;">

            <form method="POST"
                  action="{{ url_for('edit_student', student_id=student.student_id) }}">

                <div style="margin-bottom: 20px;">
                    <label for="student_id">Student ID</label>

                    <input
                        type="text"
                        id="student_id"
                        value="{{ student.student_id }}"
                        readonly
                        style="display: block; width: 100%; padding: 12px;
                               margin-top: 8px; border: 1px solid #d1d5db;
                               border-radius: 8px; background: #f3f4f6;">
                </div>

                <div style="margin-bottom: 24px;">
                    <label for="student_name">Student Name</label>

                    <input
                        type="text"
                        id="student_name"
                        name="student_name"
                        value="{{ student.student_name }}"
                        required
                        maxlength="100"
                        style="display: block; width: 100%; padding: 12px;
                               margin-top: 8px; border: 1px solid #d1d5db;
                               border-radius: 8px;">
                </div>

                <button type="submit" class="add-student-btn"
                        style="border: none; cursor: pointer;">
                    Save Changes
                </button>

                <a href="{{ url_for('students') }}"
                   class="view-history-btn">
                    Cancel
                </a>

            </form>

        </div>

    </main>

</body>
</html>
